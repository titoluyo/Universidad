        - generic [ref=e56]:
          - paragraph [ref=e58]: "Cuando los campos magnéticos asociados con núcleos ferromagnéticos se reducen, parte de la energía almacenada se devuelve a la fuente. Sin embargo, una porción de esa energía almacenada se disipa irreversiblemente en forma de calor en el núcleo. Esta pérdida de energía se atribuye a dos causas principales: las pérdidas por histéresis, que son características del material y están relacionadas con los ciclos de magnetización y desmagnetización; y las pérdidas por corrientes parásitas o corrientes de Foucault, que se originan por corrientes inducidas en el núcleo. Además, existen pérdidas de energía en núcleos sometidos a ciclos de magnetización y desmagnetización periódicos mediante excitaciones repetitivas."
